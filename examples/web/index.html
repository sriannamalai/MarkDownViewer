<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>libmdviewer wasm playground</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; height: 100vh; font-family: system-ui, sans-serif; }
  header { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #8884; }
  header h1 { font-size: 14px; margin: 0; flex: 1; }
  textarea { border: 0; border-right: 1px solid #8884; padding: 12px; font: 13px/1.5 ui-monospace, monospace; resize: none; background: transparent; color: inherit; }
  textarea:focus { outline: none; }
  iframe { border: 0; width: 100%; height: 100%; background: white; }
  #status { font-size: 12px; opacity: .7; }
</style>
</head>
<body>
<header>
  <h1>libmdviewer wasm playground</h1>
  <span id="status">loading wasm…</span>
  <label><input type="checkbox" id="dark"> dark</label>
</header>
<textarea id="src" spellcheck="false"></textarea>
<iframe id="out" sandbox="allow-scripts" title="preview"></iframe>
<script type="module">
import { loadMdviewer } from '/dist/wasm/npm/index.js';

const DEFAULT_DOC = `# Playground

Modern markdown, fully offline:

\`\`\`mermaid
graph LR
  A[markdown] --> B[libmdviewer.wasm] --> C[this preview]
\`\`\`

Inline math $e^{i\\pi} + 1 = 0$ and a block:

$$\\int_0^1 x^2\\,dx = \\tfrac{1}{3}$$

\`\`\`go
func main() { fmt.Println("highlighted") }
\`\`\`

A [relative link](docs/guide.md), an image ![logo](logo.png), a [[Wiki Page]].
`;

// Demo resolver: rewrites the demo image to an inline SVG data URI so
// the offline page shows a real image; declines everything else.
const LOGO = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="120" height="40"><rect width="120" height="40" rx="8" fill="#4a7"/><text x="60" y="25" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="14">resolved!</text></svg>');
const resolver = (kind, target) => (kind === 1 && target === 'logo.png') ? LOGO : null;

const src = document.getElementById('src');
const out = document.getElementById('out');
const dark = document.getElementById('dark');
const status = document.getElementById('status');

const mdv = await loadMdviewer();
status.textContent = `libmdviewer ${mdv.version()}`;
src.value = DEFAULT_DOC;

function rerender() {
  try {
    out.srcdoc = mdv.render(src.value, {
      theme: dark.checked ? 'dark' : 'light',
      resolver,
    });
  } catch (e) {
    out.srcdoc = `<pre style="color:#c00;padding:1em">${String(e).replace(/</g, '&lt;')}</pre>`;
  }
}
let t;
src.addEventListener('input', () => { clearTimeout(t); t = setTimeout(rerender, 150); });
dark.addEventListener('change', rerender);
rerender();
document.body.dataset.ready = '1'; // E2E hook
</script>
</body>
</html>
