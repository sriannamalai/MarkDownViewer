name: mdviewer
description: "Markdown viewer library (Go core over dart:ffi): sanitized HTML rendering with themes, mermaid, KaTeX, and syntax highlighting — fully offline."
version: 0.10.0
publish_to: none
environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'
dependencies:
  flutter: {sdk: flutter}
  ffi: ^2.1.0
  # Native KaTeX-layout math for MdvDocumentView (Apache-2.0).
  flutter_math_fork: ^0.7.4
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
