name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - run: go vet ./...
      - run: go test -race ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - run: go test -coverprofile=cover.out ./...
      - run: ./scripts/check-coverage.sh cover.out 75
  ffi:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - run: ./scripts/build-ffi.sh
      - name: Build and run C harness
        run: |
          DIR="dist/ffi/$(go env GOOS)-$(go env GOARCH)"
          gcc examples/c/harness.c -I"$DIR" -L"$DIR" -lmdviewer -o harness
          case "$(go env GOOS)" in
            linux)   LD_LIBRARY_PATH="$DIR" ./harness ;;
            darwin)  DYLD_LIBRARY_PATH="$DIR" ./harness ;;
            windows) PATH="$DIR:$PATH" ./harness.exe ;;
          esac
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - run: GOOS=js GOARCH=wasm go vet ./wasm
      - run: ./scripts/build-wasm.sh
      - run: node examples/node/harness.mjs
  # Real-browser smoke of the wasm playground: chromium loads
  # examples/web/index.html against a fresh wasm build and asserts the
  # page's E2E ready hook plus rendered mermaid/KaTeX output.
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - run: ./scripts/build-wasm.sh
      - run: npm ci
        working-directory: examples/web
      - run: npx playwright install --with-deps chromium
        working-directory: examples/web
      - name: Browser smoke
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8000/examples/web/index.html >/dev/null 2>&1 && break
            sleep 0.2
          done
          node examples/web/ci-playwright.mjs
  mobile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./scripts/build-mobile.sh all
  flutter:
    runs-on: macos-14
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: {channel: stable}
      - run: ./scripts/build-ffi.sh
      - run: flutter pub get
        working-directory: flutter/mdviewer
      - run: dart format --set-exit-if-changed .
        working-directory: flutter/mdviewer
      - run: flutter analyze
        working-directory: flutter/mdviewer
      - run: flutter test
        working-directory: flutter/mdviewer
