name: Release FFI artifacts
on:
  release: {types: [published]}
permissions:
  contents: write
env:
  TAG: ${{ github.event.release.tag_name }}
jobs:
  # Artifact smoke policy (v0.8.1 hardening plan): targets the runner
  # can execute run the C harness against the freshly built library
  # BEFORE upload — darwin-arm64, linux-amd64, linux-arm64, and
  # windows-arm64 natively on their own runners, darwin-amd64 under
  # Rosetta; the wasm job runs the Node harness. The rest stay
  # build-only: windows-amd64 is harness-covered per-commit by ci.yml's
  # ffi job, and ios/android have no hosted runner that can execute
  # those binaries at all.
  build:
    strategy:
      matrix:
        include:
          - {os: macos-14, target: darwin-arm64}
          # No Intel macOS hosted runners exist anymore (macos-13 retired
          # 2025-12); cross-compile on Apple Silicon instead — Apple's
          # toolchain targets x86_64 natively via `clang -arch x86_64`.
          - {os: macos-14, target: darwin-amd64, goarch: amd64, cc: clang -arch x86_64}
          - {os: ubuntu-latest, target: linux-amd64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
          - {os: windows-latest, target: windows-amd64}
          # windows-11-arm is a GA hosted arm64 Windows runner, but its
          # default `gcc`/`as` in PATH cannot assemble genuine ARM64 GNU
          # assembly (verified: the v0.11.0 release run failed cgo's
          # runtime/cgo build with "no such instruction" errors from
          # gcc_arm64.S) — it targets a different arch by default. A
          # native cgo build still works, but needs an explicit
          # aarch64-w64-mingw32 toolchain (llvm-mingw); see the "Install
          # ARM64 C toolchain" step below. scripts/build-ffi.sh itself
          # needed no change (already derives goos/goarch generically).
          - {os: windows-11-arm, target: windows-arm64, cc: aarch64-w64-mingw32-clang}
    runs-on: ${{ matrix.os }}
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ github.event.release.tag_name }}'}
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      # cgo needs a real aarch64-targeting C compiler; the runner's own
      # gcc/clang do not fill that role (see the matrix comment above).
      # Pinned, checksum-verified llvm-mingw ships a native ARM64-host
      # toolchain targeting aarch64-w64-mingw32 — nothing is emulated.
      # Only adds its bin dir to PATH; matrix.cc supplies the compiler
      # name so later steps (Smoke test) can reuse the same value.
      - name: Install ARM64 C toolchain (Windows ARM64)
        if: matrix.target == 'windows-arm64'
        shell: pwsh
        run: |
          $ver = "20260826"
          $pkg = "llvm-mingw-$ver-ucrt-aarch64"
          $sha256 = "dbce5a314c44cf44d02ab0d0e6bce948955b46429274df25544f9cfea4986f7b"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$ver/$pkg.zip" -OutFile "$env:RUNNER_TEMP\llvm-mingw.zip"
          $actual = (Get-FileHash "$env:RUNNER_TEMP\llvm-mingw.zip" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) { throw "checksum mismatch: got $actual want $sha256" }
          Expand-Archive "$env:RUNNER_TEMP\llvm-mingw.zip" -DestinationPath "C:\" -Force
          $bin = "C:\$pkg\bin"
          if (-not (Test-Path "$bin\aarch64-w64-mingw32-clang.exe")) { throw "llvm-mingw layout unexpected: $bin" }
          echo $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # Empty GOARCH/CC (targets without matrix overrides) are treated as
      # unset by the Go toolchain, so the native build is unaffected.
      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: VERSION="$TAG" ./scripts/build-ffi.sh
      - name: Smoke test (native)
        if: matrix.target == 'darwin-arm64' || matrix.target == 'linux-amd64' || matrix.target == 'linux-arm64' || matrix.target == 'windows-arm64'
        run: |
          target="${{ matrix.target }}"
          dir="dist/ffi/$target"
          cc="${{ matrix.cc }}"
          cc="${cc:-gcc}"
          if [[ "$target" == windows-* ]]; then
            "$cc" examples/c/harness.c -I"$dir" -L"$dir" -lmdviewer -o harness.exe
            PATH="$dir:$PATH" ./harness.exe
          elif [[ "$target" == darwin-* ]]; then
            gcc examples/c/harness.c -I"$dir" -L"$dir" -lmdviewer -o harness
            DYLD_LIBRARY_PATH="$dir" ./harness
          else
            gcc examples/c/harness.c -I"$dir" -L"$dir" -lmdviewer -o harness
            LD_LIBRARY_PATH="$dir" ./harness
          fi
      - name: Smoke test (darwin-amd64 under Rosetta)
        if: matrix.target == 'darwin-amd64'
        run: |
          dir="dist/ffi/darwin-amd64"
          gcc -arch x86_64 examples/c/harness.c -I"$dir" -L"$dir" -lmdviewer -o harness
          # Rosetta 2 is normally present on GitHub macos-14 (Apple
          # Silicon) runners; install it if a future image drops it.
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            # `arch` strips DYLD_* from the environment (SIP), so the
            # variable must be set by a child process instead: relay
            # through /usr/bin/env.
            arch -x86_64 /usr/bin/env DYLD_LIBRARY_PATH="$dir" ./harness
          else
            # Deliberate choice: if Rosetta genuinely cannot run on the
            # runner, skip the smoke with a loud warning instead of
            # failing the whole release — the artifact still built, and
            # blocking every release on an emulator quirk is worse than
            # shipping this one target unsmoked.
            echo "::warning title=darwin-amd64 smoke skipped::Rosetta unavailable on this runner; artifact uploads WITHOUT execution smoke"
          fi
      - name: Package
        run: |
          ver="${TAG#v}"
          target="${{ matrix.target }}"
          dir="dist/ffi/$target"
          test -d "$dir"   # target must match the build's GOOS-GOARCH output
          zip="libmdviewer-${ver}-${target}.zip"
          cp LICENSE ffi/README.md "$dir"/
          if [[ "$target" == windows-* ]]; then
            (cd "$dir" && 7z a "../../../$zip" .)
          else
            (cd "$dir" && zip -r "../../../$zip" .)
          fi
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Upload to release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release upload "$TAG" "$ZIP" --clobber
      - name: Record checksum
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "$ZIP" > "${{ matrix.target }}.sha256"
          else
            shasum -a 256 "$ZIP" > "${{ matrix.target }}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ matrix.target }}
          path: ${{ matrix.target }}.sha256

  wasm:
    runs-on: ubuntu-latest
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ github.event.release.tag_name }}'}
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - name: Build
        run: VERSION="$TAG" ./scripts/build-wasm.sh
      # The harness loads ../../dist/wasm/npm relative to its own file,
      # which is exactly where build-wasm.sh just assembled the npm dir.
      - name: Smoke test (Node harness)
        run: node examples/node/harness.mjs
      - name: Package
        run: |
          ver="${TAG#v}"
          zip="libmdviewer-${ver}-wasm.zip"
          (cd dist/wasm/npm && zip -r "../../../$zip" .)
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Upload to release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release upload "$TAG" "$ZIP" --clobber
      - name: Record checksum
        run: sha256sum "$ZIP" > wasm.sha256
      - uses: actions/upload-artifact@v4
        with: {name: sha256-wasm, path: wasm.sha256}

  ios:
    runs-on: macos-14
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ github.event.release.tag_name }}'}
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - name: Build
        run: VERSION="$TAG" ./scripts/build-mobile.sh ios
      - name: Package
        run: |
          ver="${TAG#v}"
          zip="libmdviewer-${ver}-ios.xcframework.zip"
          cp LICENSE ffi/README.md dist/mobile/ios/
          (cd dist/mobile/ios && zip -r "../../../$zip" .)
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Upload to release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release upload "$TAG" "$ZIP" --clobber
      - name: Record checksum
        run: shasum -a 256 "$ZIP" > ios.sha256
      - uses: actions/upload-artifact@v4
        with: {name: sha256-ios, path: ios.sha256}
  android:
    runs-on: ubuntu-latest
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ github.event.release.tag_name }}'}
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - name: Build
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" VERSION="$TAG" ./scripts/build-mobile.sh android
      - name: Package
        run: |
          ver="${TAG#v}"
          zip="libmdviewer-${ver}-android.zip"
          cp LICENSE ffi/README.md dist/mobile/android/
          (cd dist/mobile/android && zip -r "../../../$zip" .)
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Upload to release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release upload "$TAG" "$ZIP" --clobber
      - name: Record checksum
        run: sha256sum "$ZIP" > android.sha256
      - uses: actions/upload-artifact@v4
        with: {name: sha256-android, path: android.sha256}

  # Aggregates every job's per-zip checksum into one SHA256SUMS file
  # (standard `sha256sum` format, sorted by filename) and uploads it as
  # the release's 10th asset, so consumers can `sha256sum -c` downloads.
  checksums:
    needs: [build, wasm, ios, android]
    runs-on: ubuntu-latest
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sha256-*
          path: sums
          merge-multiple: true
      - name: Aggregate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat sums/*.sha256 | LC_ALL=C sort -k2 > SHA256SUMS
          # One line per shipped zip: 6 build-matrix targets + wasm +
          # ios + android. A mismatch means a job stopped uploading its
          # checksum — fail loudly rather than publish a partial file.
          test "$(wc -l < SHA256SUMS)" -eq 9
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber
