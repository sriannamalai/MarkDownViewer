name: Release FFI artifacts
on:
  release: {types: [published]}
permissions:
  contents: write
env:
  TAG: ${{ github.event.release.tag_name }}
jobs:
  build:
    strategy:
      matrix:
        include:
          - {os: macos-14, target: darwin-arm64}
          # No Intel macOS hosted runners exist anymore (macos-13 retired
          # 2025-12); cross-compile on Apple Silicon instead — Apple's
          # toolchain targets x86_64 natively via `clang -arch x86_64`.
          - {os: macos-14, target: darwin-amd64, goarch: amd64, cc: clang -arch x86_64}
          - {os: ubuntu-latest, target: linux-amd64}
          - {os: ubuntu-24.04-arm, target: linux-arm64}
          - {os: windows-latest, target: windows-amd64}
    runs-on: ${{ matrix.os }}
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ github.event.release.tag_name }}'}
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      # Empty GOARCH/CC (targets without matrix overrides) are treated as
      # unset by the Go toolchain, so the native build is unaffected.
      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: VERSION="$TAG" ./scripts/build-ffi.sh
      - name: Package
        run: |
          ver="${TAG#v}"
          dir="dist/ffi/${{ matrix.target }}"
          test -d "$dir"   # target must match the build's GOOS-GOARCH output
          zip="libmdviewer-${ver}-${{ matrix.target }}.zip"
          cp LICENSE ffi/README.md "$dir"/
          if [[ "${{ matrix.target }}" == windows-* ]]; then
            (cd "$dir" && 7z a "../../../$zip" .)
          else
            (cd "$dir" && zip -r "../../../$zip" .)
          fi
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Upload to release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release upload "$TAG" "$ZIP" --clobber

  wasm:
    runs-on: ubuntu-latest
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ github.event.release.tag_name }}'}
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - name: Build
        run: VERSION="$TAG" ./scripts/build-wasm.sh
      - name: Package
        run: |
          ver="${TAG#v}"
          zip="libmdviewer-${ver}-wasm.zip"
          (cd dist/wasm/npm && zip -r "../../../$zip" .)
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Upload to release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release upload "$TAG" "$ZIP" --clobber

  ios:
    runs-on: macos-14
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ github.event.release.tag_name }}'}
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - name: Build
        run: VERSION="$TAG" ./scripts/build-mobile.sh ios
      - name: Package
        run: |
          ver="${TAG#v}"
          zip="libmdviewer-${ver}-ios.xcframework.zip"
          cp LICENSE ffi/README.md dist/mobile/ios/
          (cd dist/mobile/ios && zip -r "../../../$zip" .)
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Upload to release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release upload "$TAG" "$ZIP" --clobber
  android:
    runs-on: ubuntu-latest
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ github.event.release.tag_name }}'}
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.x'}
      - name: Build
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" VERSION="$TAG" ./scripts/build-mobile.sh android
      - name: Package
        run: |
          ver="${TAG#v}"
          zip="libmdviewer-${ver}-android.zip"
          cp LICENSE ffi/README.md dist/mobile/android/
          (cd dist/mobile/android && zip -r "../../../$zip" .)
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - name: Upload to release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release upload "$TAG" "$ZIP" --clobber
